name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Descobre o que mudou para rodar só os jobs afetados (monorepo poliglota).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      tenant-service: ${{ steps.filter.outputs.tenant-service }}
      performance-service: ${{ steps.filter.outputs.performance-service }}
      recruitment-service: ${{ steps.filter.outputs.recruitment-service }}
      analytics-ai-service: ${{ steps.filter.outputs.analytics-ai-service }}
      platform: ${{ steps.filter.outputs.platform }}
      engagement-service: ${{ steps.filter.outputs.engagement-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - '.spectral.yaml'
              - '.github/workflows/ci.yml'
            tenant-service:
              - 'services/tenant-service/**'
              - 'contracts/asyncapi/schemas/**'
              - '.github/workflows/ci.yml'
            performance-service:
              - 'services/performance-service/**'
              - '.github/workflows/ci.yml'
            recruitment-service:
              - 'services/recruitment-service/**'
              - 'contracts/asyncapi/schemas/**'
              - '.github/workflows/ci.yml'
            engagement-service:
              - 'services/engagement-service/**'
              - 'contracts/asyncapi/schemas/**'
              - '.github/workflows/ci.yml'
            analytics-ai-service:
              - 'services/analytics-ai-service/**'
              - 'contracts/asyncapi/schemas/**'
              - '.github/workflows/ci.yml'
            platform:
              - 'docker-compose*.yml'
              - 'infra/**'
              - 'init/**'
              - 'scripts/**'
              - '.env.example'
              - '.github/workflows/ci.yml'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spectral (OpenAPI 3.1 + AsyncAPI 3.0)
        run: npx -y @stoplight/spectral-cli@6.15.0 lint "contracts/openapi/*.yaml" "contracts/asyncapi/*.yaml" --fail-severity=warn
      - name: JSON Schemas dos eventos são JSON válido
        run: for f in contracts/asyncapi/schemas/*.json; do python3 -m json.tool "$f" > /dev/null; done

  tenant-service:
    needs: changes
    if: needs.changes.outputs.tenant-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tenant-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/tenant-service/go.mod
          cache-dependency-path: services/tenant-service/go.sum
      - name: Lint (gofmt + go vet)
        run: make lint
      - name: Testes (unitários + Postgres real via testcontainers)
        run: make test
      - name: Build
        run: make build
      - name: Imagem Docker
        run: docker build -t people-platform/tenant-service:ci .

  performance-service:
    needs: changes
    if: needs.changes.outputs.performance-service == 'true'
    runs-on: ubuntu-latest
    # Mesma imagem usada localmente (Java e Gradle não são pré-requisitos da máquina).
    container:
      image: gradle:8.14.3-jdk21
    defaults:
      run:
        working-directory: services/performance-service
    steps:
      - uses: actions/checkout@v4
      - name: Lint, testes e build (ktlint + JUnit)
        run: gradle --no-daemon --console=plain ktlintCheck test build

  recruitment-service:
    needs: changes
    if: needs.changes.outputs.recruitment-service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/recruitment-service
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2
      - name: Dependências
        run: composer install --no-interaction --prefer-dist
      - name: Lint (Pint)
        run: make lint
      - name: Testes unitários e de API (SQLite em memória)
        run: make test-unit
      - name: Banco como no compose (dono, papel da aplicação sem BYPASSRLS)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE recruitment_service_owner LOGIN PASSWORD 'ci';
          CREATE DATABASE recruitment_service OWNER recruitment_service_owner;
          CREATE ROLE recruitment_app NOLOGIN;
          CREATE ROLE recruitment_service_app LOGIN PASSWORD 'ci' IN ROLE recruitment_app;
          SQL
          psql -h localhost -U postgres -d recruitment_service -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO recruitment_service_owner; REVOKE ALL ON SCHEMA public FROM PUBLIC;"
      - name: Vazamento entre tenants (Postgres real com RLS)
        env:
          RECRUITMENT_PG_TESTS: "1"
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: recruitment_service
          DB_USERNAME: recruitment_service_app
          DB_PASSWORD: ci
          DB_MIGRATION_USERNAME: recruitment_service_owner
          DB_MIGRATION_PASSWORD: ci
        run: php artisan test --testsuite=Integration
      - name: Imagem Docker
        run: docker build -t people-platform/recruitment-service:ci .

  engagement-service:
    needs: changes
    if: needs.changes.outputs.engagement-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engagement-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/engagement-service/package-lock.json
      - run: make install
      - name: Lint (eslint + tsc)
        run: make lint
      - name: Testes (unitários + Postgres real via testcontainers)
        run: make test
      - name: Build
        run: make build
      - name: Imagem Docker
        run: docker build -t people-platform/engagement-service:ci .

  analytics-ai-service:
    needs: changes
    if: needs.changes.outputs.analytics-ai-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics-ai-service/pyproject.toml
      - name: Instala dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff + mypy)
        run: ruff check . && ruff format --check . && mypy src
      - name: Testes (LLM falso, fixtures dos schemas)
        run: pytest -q
      - name: Imagem Docker
        run: docker build -t people-platform/analytics-ai-service:ci .

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (todos os perfis)
        run: docker compose --profile core --profile observability --profile tools --profile tenant-service --profile recruitment-service --profile engagement-service --profile analytics-ai-service config -q
      - name: KrakenD valida a configuração do gateway
        run: docker run --rm -v "$PWD/infra/gateway:/etc/krakend:ro" krakend:2.13.11 check -tlc /etc/krakend/krakend.json
      - name: Realm do Keycloak é JSON válido
        run: python3 -m json.tool infra/keycloak/realm-people.json > /dev/null
      - name: ShellCheck nos scripts
        run: shellcheck scripts/*.sh init/aws/*.sh infra/postgres/init/*.sh
