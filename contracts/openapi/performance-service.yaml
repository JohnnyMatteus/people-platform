    PdiActionKind:
      type: string
      enum: [COURSE, MENTORING, PROJECT, READING]
    PdiActionStatus:
      type: string
      enum: [PLANNED, IN_PROGRESS, DONE]
    PdiAction:
      type: object
      required: [id, employee_id, title, kind, due_on, status]
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        title:
          type: string
        competency:
          type: string
        kind:
          $ref: "#/components/schemas/PdiActionKind"
        due_on:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/PdiActionStatus"
    Pdi:
      type: object
      required: [employee_id, gaps, actions, suggestions]
      properties:
        employee_id:
          type: string
          format: uuid
        gaps:
          type: array
          description: Distância entre autoavaliação e avaliação do gestor por competência, do último ciclo consolidado.
          items:
            type: object
            required: [competency, gap]
            properties:
              competency:
                type: string
              gap:
                type: integer
                minimum: 0
        actions:
          type: array
          items:
            $ref: "#/components/schemas/PdiAction"
        suggestions:
          type: array
          description: Só sugestões; nada entra no plano sem POST em /pdi/actions.
          items:
            type: object
            required: [title, kind, reason]
            properties:
              title:
                type: string
              competency:
                type: string
              kind:
                $ref: "#/components/schemas/PdiActionKind"
              reason:
                type: string
    ObjectiveLevel:
      type: string
      enum: [COMPANY, TEAM, INDIVIDUAL]
    KeyResultInput:
      type: object
      additionalProperties: false
      required: [title, start, target]
      properties:
        title:
          type: string
          minLength: 3
        start:
          type: string
          description: Ponto de partida, decimal como string.
          examples: ["0"]
        target:
          type: string
          description: Meta, decimal como string; pode ser menor que a partida (reduzir um indicador) e nunca igual a ela.
          examples: ["100"]
    CreateObjective:
      type: object
      additionalProperties: false
      required: [level, title, key_results]
      properties:
        level:
          $ref: "#/components/schemas/ObjectiveLevel"
        title:
          type: string
          minLength: 3
        owner_id:
          type: string
          format: uuid
          description: Obrigatório só para equipe e pessoa de outra pessoa; vazio vale o chamador. Proibido na empresa.
        parent_id:
          type: string
          format: uuid
          description: Objetivo de nível mais alto de que este se desdobra.
        key_results:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/KeyResultInput"
    KeyResult:
      type: object
      required: [id, title, start, target, current, progress]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        start:
          type: string
        target:
          type: string
        current:
          type: string
        progress:
          type: string
          description: Fração concluída entre 0 e 1.
    Objective:
      type: object
      required: [id, level, title, status, progress, key_results]
      properties:
        id:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/ObjectiveLevel"
        owner_id:
          type: [string, "null"]
          format: uuid
        owner_name:
          type: [string, "null"]
        parent_id:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        progress:
          type: string
          description: Média do progresso dos resultados-chave, entre 0 e 1.
        key_results:
          type: array
          items:
            $ref: "#/components/schemas/KeyResult"
    CheckInInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
        comment:
          type: string
    CheckIn:
      type: object
      required: [id, key_result_id, value, created_by, created_at, key_result]
      properties:
        id:
          type: string
          format: uuid
        key_result_id:
          type: string
          format: uuid
        value:
          type: string
        comment:
          type: [string, "null"]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        key_result:
          $ref: "#/components/schemas/KeyResult"
