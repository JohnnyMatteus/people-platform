openapi: 3.1.0
info:
  title: People Platform - performance-service
  version: 0.1.0
  summary: Avaliações, calibração, nine box, sucessão, OKRs e PDI.
  description: |
    Contrato do performance-service (Spring Boot sobre o núcleo de domínio Kotlin, ADR 0011).
    O tenant vem sempre da claim `tenant_id` do token, nunca de parâmetro; a identidade da pessoa
    é a claim `sub`, que é também o `employee_id` da própria pessoa.
    Papéis (claim `realm_access.roles`): `employee`, `manager`, `tenant-admin`.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: People Platform
    url: https://github.com/JohnnyMatteus/people-platform
servers:
  - url: http://localhost:8000/performance
    description: Gateway local (KrakenD)
security:
  - bearerAuth: []
tags:
  - name: nine-box
    description: Política, classificação e calibração da matriz desempenho × potencial.
  - name: succession
    description: Posições críticas e mapas de sucessão.
  - name: cycles
    description: Ciclos de avaliação e avaliações (autoavaliação e gestor).
  - name: pdi
    description: Plano de desenvolvimento individual.
  - name: people
    description: Quem sou eu e o cadastro mínimo de colaboradores do tenant.
  - name: okr
    description: Objetivos desdobrados (empresa, equipe, pessoa), resultados-chave e check-ins.
paths:
  /v1/nine-box/policy:
    get:
      tags: [nine-box]
      operationId: getNineBoxPolicy
      summary: Política de nine box do tenant (escala, limiares e regras de calibração).
      responses:
        "200":
          description: Política vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NineBoxPolicy"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      tags: [nine-box]
      operationId: setNineBoxPolicy
      summary: Define a política (admin do tenant). Vale para sessões abertas depois da mudança.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NineBoxPolicy"
      responses:
        "200":
          description: Política gravada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NineBoxPolicy"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/cycles/{cycleId}/calibration-sessions:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      tags: [nine-box]
      operationId: openCalibrationSession
      summary: Abre a sessão de calibração do ciclo com as avaliações consolidadas.
      responses:
        "201":
          description: Sessão aberta com as posições calculadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationSession"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/calibration-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [nine-box]
      operationId: getCalibrationSession
      summary: Estado da sessão, distribuição por quadrante e alertas.
      responses:
        "200":
          description: Sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationSession"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/calibration-sessions/{sessionId}/adjustments:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [nine-box]
      operationId: adjustPlacement
      summary: Move uma pessoa de quadrante, com justificativa e dentro do limite de faixas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employee_id, to, justification]
              properties:
                employee_id:
                  type: string
                  format: uuid
                to:
                  $ref: "#/components/schemas/Quadrant"
                justification:
                  type: string
                  minLength: 20
      responses:
        "201":
          description: Ajuste registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adjustment"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/calibration-sessions/{sessionId}/close:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [nine-box]
      operationId: closeCalibrationSession
      summary: Fecha a sessão e publica NineBoxCalibrado para cada pessoa.
      responses:
        "200":
          description: Resultado final.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationSession"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/employees/{employeeId}/nine-box-history:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [nine-box]
      operationId: getNineBoxHistory
      summary: Histórico por ciclo e tendência (gestor da pessoa, RH ou a própria pessoa).
      responses:
        "200":
          description: Histórico.
          content:
            application/json:
              schema:
                type: object
                required: [entries, trend]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [cycle_id, quadrant, calibrated, closed_at]
                      properties:
                        cycle_id:
                          type: string
                          format: uuid
                        quadrant:
                          $ref: "#/components/schemas/Quadrant"
                        calibrated:
                          type: boolean
                        closed_at:
                          type: string
                          format: date-time
                  trend:
                    type: string
                    enum: [UP, DOWN, STABLE, LATERAL, INSUFFICIENT_DATA]
        "404":
          $ref: "#/components/responses/Problem"
  /v1/critical-positions:
    get:
      tags: [succession]
      operationId: listCriticalPositions
      summary: Lista posições críticas com a força do banco de sucessores.
      responses:
        "200":
          description: Posições.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuccessionPlan"
    post:
      tags: [succession]
      operationId: createCriticalPosition
      summary: Cadastra uma posição crítica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                incumbent_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Posição criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessionPlan"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/critical-positions/{positionId}/successors:
    parameters:
      - name: positionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [succession]
      operationId: nominateSuccessor
      summary: Indica um sucessor com prontidão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employee_id, readiness]
              properties:
                employee_id:
                  type: string
                  format: uuid
                readiness:
                  $ref: "#/components/schemas/Readiness"
      responses:
        "201":
          description: Mapa atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessionPlan"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/critical-positions/{positionId}/successors/{employeeId}/readiness-suggestion:
    parameters:
      - name: positionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [succession]
      operationId: suggestReadiness
      summary: Sugestão de prontidão a partir do último nine box e do tempo na função (`role_since` do cadastro).
      responses:
        "200":
          description: Sugestão (null quando o potencial é baixo).
          content:
            application/json:
              schema:
                type: object
                required: [suggestion]
                properties:
                  suggestion:
                    oneOf:
                      - $ref: "#/components/schemas/Readiness"
                      - type: "null"
  /v1/me:
    get:
      tags: [people]
      operationId: getMe
      summary: Identidade e papéis do chamador, lidos do token.
      responses:
        "200":
          description: Chamador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/employees:
    get:
      tags: [people]
      operationId: listEmployees
      summary: Colaboradores cadastrados no tenant (gestor ou admin).
      responses:
        "200":
          description: Colaboradores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      tags: [people]
      operationId: upsertEmployee
      summary: Cadastra ou atualiza um colaborador (gestor ou admin). O id é o `sub` do token da pessoa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Employee"
      responses:
        "200":
          description: Colaborador gravado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/cycles:
    get:
      tags: [cycles]
      operationId: listCycles
      summary: Lista os ciclos de avaliação do tenant.
      responses:
        "200":
          description: Ciclos, do mais recente ao mais antigo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"
    post:
      tags: [cycles]
      operationId: createCycle
      summary: Cria um ciclo em rascunho (admin do tenant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, type]
              properties:
                name:
                  type: string
                  minLength: 3
                type:
                  $ref: "#/components/schemas/CycleType"
      responses:
        "201":
          description: Ciclo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/cycles/{cycleId}/open:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      tags: [cycles]
      operationId: openCycle
      summary: Abre o ciclo para receber avaliações (admin do tenant).
      responses:
        "200":
          description: Ciclo aberto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/cycles/{cycleId}/evaluations:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    get:
      tags: [cycles]
      operationId: listEvaluationProgress
      summary: Andamento das avaliações do ciclo por pessoa (gestor ou admin).
      responses:
        "200":
          description: Andamento.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationProgress"
  /v1/cycles/{cycleId}/evaluations/self:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      tags: [cycles]
      operationId: submitSelfEvaluation
      summary: Autoavaliação da própria pessoa (employee_id vem do token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfEvaluationInput"
      responses:
        "201":
          description: Autoavaliação registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/cycles/{cycleId}/evaluations/manager:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    post:
      tags: [cycles]
      operationId: submitManagerEvaluation
      summary: Avaliação do gestor, com nota de desempenho e de potencial. Quando a autoavaliação já existe, a avaliação é consolidada e AvaliacaoConcluida é publicado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerEvaluationInput"
      responses:
        "201":
          description: Avaliação registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/cycles/{cycleId}/calibration-sessions/current:
    parameters:
      - $ref: "#/components/parameters/CycleId"
    get:
      tags: [nine-box]
      operationId: getCycleCalibrationSession
      summary: Sessão de calibração do ciclo, se já foi aberta.
      responses:
        "200":
          description: Sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationSession"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/employees/{employeeId}/pdi:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [pdi]
      operationId: getPdi
      summary: PDI da pessoa, com gaps da avaliação e sugestões a partir do nine box (a própria pessoa, gestor ou admin).
      responses:
        "200":
          description: Plano.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pdi"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/employees/{employeeId}/pdi/actions:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [pdi]
      operationId: addPdiAction
      summary: Adiciona uma ação ao PDI. Sugestões só entram no plano por este endpoint, com ação humana.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, kind, due_on]
              properties:
                title:
                  type: string
                  minLength: 3
                competency:
                  type: string
                kind:
                  $ref: "#/components/schemas/PdiActionKind"
                due_on:
                  type: string
                  format: date
      responses:
        "201":
          description: Ação criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdiAction"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/pdi-actions/{actionId}:
    parameters:
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [pdi]
      operationId: updatePdiActionStatus
      summary: Avança o status da ação (PLANNED, IN_PROGRESS, DONE). Não volta de DONE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/PdiActionStatus"
      responses:
        "200":
          description: Ação atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdiAction"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/objectives:
    get:
      tags: [okr]
      operationId: listObjectives
      summary: Objetivos visíveis ao chamador (empresa e equipe para todos; individuais só do próprio e de quem gere).
      parameters:
        - name: level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ObjectiveLevel"
        - name: owner_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Objetivos, do mais antigo para o mais recente, com progresso calculado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"
    post:
      tags: [okr]
      operationId: createObjective
      summary: Cria um objetivo com seus resultados-chave. Empresa só o tenant-admin; equipe só gestor; pessoa, a própria ou gestor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObjective"
      responses:
        "201":
          description: Objetivo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/objectives/{objectiveId}:
    parameters:
      - $ref: "#/components/parameters/ObjectiveId"
    get:
      tags: [okr]
      operationId: getObjective
      summary: Um objetivo com os resultados-chave (de outro tenant, ou individual alheio, responde 404).
      responses:
        "200":
          description: Objetivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/objectives/{objectiveId}/close:
    parameters:
      - $ref: "#/components/parameters/ObjectiveId"
    post:
      tags: [okr]
      operationId: closeObjective
      summary: Encerra o objetivo; depois disso não aceita check-in.
      responses:
        "200":
          description: Objetivo encerrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/key-results/{keyResultId}/check-ins:
    parameters:
      - name: keyResultId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [okr]
      operationId: checkInKeyResult
      summary: Registra o valor atual do resultado-chave. Dono do objetivo ou gestor; empresa só o tenant-admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "201":
          description: Check-in registrado; o resultado-chave devolve o progresso atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ObjectiveId:
      name: objectiveId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Erro no formato RFC 9457.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
  schemas:
    Quadrant:
      type: string
      enum: [Q1, Q2, Q3, Q4, Q5, Q6, Q7, Q8, Q9]
      description: Q1 = baixo/baixo ... Q9 = alto desempenho e alto potencial.
    Readiness:
      type: string
      enum: [READY_NOW, ONE_TO_TWO_YEARS, THREE_PLUS_YEARS]
    AxisThresholds:
      type: object
      required: [medium_from, high_from]
      properties:
        medium_from:
          type: string
          description: Decimal em string para não perder precisão.
          examples: ["2.5"]
        high_from:
          type: string
          examples: ["3.75"]
    NineBoxPolicy:
      type: object
      required: [scale_min, scale_max, performance, potential]
      properties:
        scale_min:
          type: string
          examples: ["1"]
        scale_max:
          type: string
          examples: ["5"]
        performance:
          $ref: "#/components/schemas/AxisThresholds"
        potential:
          $ref: "#/components/schemas/AxisThresholds"
        max_steps_per_axis:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
        top_box_warning_share:
          type: string
          default: "0.20"
        min_justification_length:
          type: integer
          minimum: 0
          default: 20
    Adjustment:
      type: object
      required: [employee_id, from, to, calibrated_by, justification, at]
      properties:
        employee_id:
          type: string
          format: uuid
        from:
          $ref: "#/components/schemas/Quadrant"
        to:
          $ref: "#/components/schemas/Quadrant"
        calibrated_by:
          type: string
          format: uuid
        justification:
          type: string
        at:
          type: string
          format: date-time
    CalibrationSession:
      type: object
      required: [id, cycle_id, status, policy, placements, distribution, warnings, adjustments]
      properties:
        id:
          type: string
          format: uuid
        policy:
          $ref: "#/components/schemas/NineBoxPolicy"
        cycle_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        placements:
          type: array
          items:
            type: object
            required: [employee_id, original, current]
            properties:
              employee_id:
                type: string
                format: uuid
              employee_name:
                type: string
              performance_score:
                type: string
              potential_score:
                type: string
              original:
                $ref: "#/components/schemas/Quadrant"
              current:
                $ref: "#/components/schemas/Quadrant"
        distribution:
          type: object
          additionalProperties:
            type: integer
        warnings:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum: [TOP_BOX_ABOVE_GUIDELINE]
              share:
                type: string
              guideline:
                type: string
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/Adjustment"
    SuccessionPlan:
      type: object
      required: [position_id, title, bench_strength, successors]
      properties:
        position_id:
          type: string
          format: uuid
        title:
          type: string
        incumbent_id:
          type: string
          format: uuid
        incumbent_name:
          type: string
        bench_strength:
          type: string
          enum: [NONE, WEAK, ADEQUATE, STRONG]
        successors:
          type: array
          items:
            type: object
            required: [employee_id, readiness]
            properties:
              employee_id:
                type: string
                format: uuid
              employee_name:
                type: string
              readiness:
                $ref: "#/components/schemas/Readiness"
    Me:
      type: object
      required: [employee_id, tenant_id, roles]
      properties:
        employee_id:
          type: string
          format: uuid
