openapi: 3.1.0
info:
  title: People Platform - recruitment-service (ATS)
  version: 0.0.1
  summary: Vagas, candidatos, pipeline por etapas, entrevistas e scorecards.
  description: |
    Contrato do ATS. Convenções: bearer JWT do Keycloak (realm people) com tenant_id, erros em
    problem+json, paginação por cursor. Só os papéis tenant-admin e manager acessam (dados de candidatos).
  license:
    name: MIT
    identifier: MIT
  contact:
    name: People Platform
    url: https://github.com/JohnnyMatteus/people-platform
servers:
  - url: http://localhost:8000/recruitment
    description: Gateway local (KrakenD)
security:
  - bearerAuth: []
tags:
  - name: recruitment
    description: Vagas, candidatos, pipeline por etapas, entrevistas e scorecards.
paths:
  /v1/jobs:
    get:
      tags: [recruitment]
      operationId: listJobs
      summary: Lista vagas do tenant (paginação por cursor).
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de vagas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  next_cursor:
                    type: string
    post:
      tags: [recruitment]
      operationId: openJob
      summary: Abre uma vaga com as etapas do pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Job"
      responses:
        "201":
          description: Vaga aberta.
  /v1/pipeline-template:
    get:
      tags: [recruitment]
      operationId: getPipelineTemplate
      summary: Etapas padrão do tenant para vagas novas.
      responses:
        "200":
          description: Etapas padrão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineTemplate"
    put:
      tags: [recruitment]
      operationId: replacePipelineTemplate
      summary: Configura as etapas padrão do tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineTemplate"
      responses:
        "200":
          description: Etapas padrão atualizadas.
        "422":
          description: Etapas inválidas (menos de duas, repetidas ou fora do padrão kebab-case).
  /v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [recruitment]
      operationId: getJob
      summary: Detalha uma vaga.
      responses:
        "200":
          description: Vaga.
        "404":
          description: Vaga inexistente ou de outro tenant.
  /v1/jobs/{jobId}/applications:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [recruitment]
      operationId: listApplications
      summary: Lista as candidaturas de uma vaga (paginação por cursor).
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de candidaturas.
    post:
      tags: [recruitment]
      operationId: apply
      summary: Registra candidatura; o currículo vai ao S3 por URL pré-assinada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                resume_content_type:
                  type: string
                  default: application/pdf
                  enum: [application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document]
      responses:
        "201":
          description: Candidatura criada com URL de upload do currículo (chave com prefixo tenants/{tenant_id}/).
        "409":
          description: Vaga fechada ou candidato já inscrito.
  /v1/applications/{applicationId}/stage:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [recruitment]
      operationId: moveStage
      summary: Move a candidatura de etapa; a etapa final "contratado" publica CandidatoContratado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                start_date:
                  type: string
                  format: date
                  description: Obrigatório na etapa final (contratação).
      responses:
        "200":
          description: Etapa alterada.
        "409":
          description: Candidatura já encerrada (contratada ou rejeitada).
        "422":
          description: Etapa inexistente no pipeline da vaga ou start_date ausente na contratação.
  /v1/applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [recruitment]
      operationId: getApplication
      summary: Detalha a candidatura com entrevistas e scorecards.
      responses:
        "200":
          description: Candidatura.
  /v1/applications/{applicationId}/reject:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [recruitment]
      operationId: rejectApplication
      summary: Encerra a candidatura como rejeitada.
      responses:
        "200":
          description: Candidatura rejeitada.
  /v1/applications/{applicationId}/resume:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [recruitment]
      operationId: getResumeUrl
      summary: URL pré-assinada e temporária para baixar o currículo.
      responses:
        "200":
          description: URL de download.
  /v1/applications/{applicationId}/interviews:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [recruitment]
      operationId: scheduleInterview
      summary: Agenda uma entrevista da candidatura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, scheduled_at]
              properties:
                kind:
                  type: string
                scheduled_at:
                  type: string
                  format: date-time
                interviewer_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Entrevista agendada.
  /v1/interviews/{interviewId}/scorecards:
    parameters:
      - name: interviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [recruitment]
      operationId: submitScorecard
      summary: Envia o scorecard estruturado de uma entrevista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scorecard"
      responses:
        "201":
          description: Scorecard registrado (o avaliador é o sub do token).
        "409":
          description: Este avaliador já enviou o scorecard desta entrevista.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  schemas:
    Job:
      type: object
      required: [title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        unit:
          type: string
        stages:
          type: array
          description: Etapas ordenadas; a última é a de contratação. Se omitido, vale o modelo do tenant.
          items:
            type: string
          examples: [[triagem, entrevista-rh, entrevista-gestor, proposta, contratado]]
    PipelineTemplate:
      type: object
      required: [stages]
      properties:
        stages:
          type: array
          minItems: 2
          items:
            type: string
    Scorecard:
      type: object
      required: [recommendation, ratings]
      properties:
        recommendation:
          type: string
          enum: [strong_yes, yes, "no", strong_no]
        ratings:
          type: array
          minItems: 1
          items:
            type: object
            required: [criterion, score]
            properties:
              criterion:
                type: string
              score:
                type: integer
                minimum: 1
                maximum: 5
        notes:
          type: string
