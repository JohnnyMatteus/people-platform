# Ambiente local da People Platform (ADR 0010). Perfis:
#   core            Postgres (um banco por serviço), Kafka KRaft, Keycloak, gateway, LocalStack, Mailpit
#   observability   OpenTelemetry Collector, Prometheus, Grafana, Jaeger
#   tools           Kafka UI, Adminer
#   tenant-service  o serviço Go e o job de migração dele
#   recruitment-service  o ATS (PHP + Laravel), o job de migração e o relay da outbox
#   engagement-service  o serviço NestJS e o job de migração dele
#   analytics-ai-service  o serviço Python de analytics e IA
#   learning-service  trilhas e matrículas (Go), com o job de migração e o consumidor de CandidatoContratado
#   web             o front-end Vue (nginx), em http://localhost:5173, falando com o gateway por /api
# Uso: make up (core), make up-all (core + observability + tools + serviços). Senhas são só de dev.
name: people-platform

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # ---------------------------------------------------------------- core
  postgres:
    image: postgres:17.6-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-dev-only-change-me}
      TENANT_DB_OWNER_PASSWORD: ${TENANT_DB_OWNER_PASSWORD:-dev-only-change-me}
      TENANT_DB_APP_PASSWORD: ${TENANT_DB_APP_PASSWORD:-dev-only-change-me}
      PERFORMANCE_DB_OWNER_PASSWORD: ${PERFORMANCE_DB_OWNER_PASSWORD:-dev-only-change-me}
      PERFORMANCE_DB_APP_PASSWORD: ${PERFORMANCE_DB_APP_PASSWORD:-dev-only-change-me}
      RECRUITMENT_DB_OWNER_PASSWORD: ${RECRUITMENT_DB_OWNER_PASSWORD:-dev-only-change-me}
      RECRUITMENT_DB_APP_PASSWORD: ${RECRUITMENT_DB_APP_PASSWORD:-dev-only-change-me}
      ENGAGEMENT_DB_OWNER_PASSWORD: ${ENGAGEMENT_DB_OWNER_PASSWORD:-dev-only-change-me}
      ENGAGEMENT_DB_APP_PASSWORD: ${ENGAGEMENT_DB_APP_PASSWORD:-dev-only-change-me}
      ANALYTICS_DB_OWNER_PASSWORD: ${ANALYTICS_DB_OWNER_PASSWORD:-dev-only-change-me}
      ANALYTICS_DB_APP_PASSWORD: ${ANALYTICS_DB_APP_PASSWORD:-dev-only-change-me}
      LEARNING_DB_OWNER_PASSWORD: ${LEARNING_DB_OWNER_PASSWORD:-dev-only-change-me}
      LEARNING_DB_APP_PASSWORD: ${LEARNING_DB_APP_PASSWORD:-dev-only-change-me}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-only-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/seed:/seed:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
    networks: [people-platform-net]

  kafka:
    image: confluentinc/cp-kafka:7.9.1
    profiles: [core]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-lVp857k5QSG57ZcJB-x0_w}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Tópicos são criados explicitamente pelo kafka-init: nome errado vira erro, não tópico novo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    networks: [people-platform-net]

  kafka-init:
    image: confluentinc/cp-kafka:7.9.1
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for topic in people.tenant.events.v1 people.performance.events.v1 people.recruitment.events.v1 people.engagement.events.v1 people.directory.events.v1; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1
        done
    restart: "no"
    networks: [people-platform-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-only-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-change-me}
      # Emissor fixo: tokens pedidos pelo host ou pela rede interna têm o mesmo "iss".
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/realm-people.json:/opt/keycloak/data/import/realm-people.json:ro
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 60s
      # A imagem não tem curl: o teste abre a porta de gerenciamento (9000) via /dev/tcp do bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
    networks: [people-platform-net]

  gateway:
    image: krakend:2.13.11
    profiles: [core]
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    volumes:
      - ./infra/gateway:/etc/krakend:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/__health"]
    networks: [people-platform-net]

  localstack:
    image: localstack/localstack:4.5.0
    profiles: [core]
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      SERVICES: s3,ses
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      # O SES do LocalStack entrega os e-mails por SMTP no Mailpit.
      SMTP_HOST: mailpit:1025
      S3_ASSETS_BUCKET: ${S3_ASSETS_BUCKET:-people-platform-tenant-assets}
      S3_RESUMES_BUCKET: ${S3_RESUMES_BUCKET:-people-platform-recruitment-resumes}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./init/aws:/etc/localstack/init/ready.d:ro
    healthcheck:
      <<: *healthcheck-defaults
      # Pronto só depois que o bootstrap (buckets e identidades SES) terminou.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
    networks: [people-platform-net]

  mailpit:
    image: axllent/mailpit:v1.26
    profiles: [core]
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/mailpit", "readyz"]
    networks: [people-platform-net]

  # ------------------------------------------------------- tenant-service
  tenant-service-migrate:
    build:
      context: ./services/tenant-service
    image: people-platform/tenant-service:dev
    profiles: [tenant-service]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: postgres://tenant_service_owner:${TENANT_DB_OWNER_PASSWORD:-dev-only-change-me}@postgres:5432/tenant_service?sslmode=disable
    restart: "no"
    networks: [people-platform-net]

  tenant-service:
    image: people-platform/tenant-service:dev
    profiles: [tenant-service]
    command: ["serve"]
    depends_on:
      tenant-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://tenant_service_app:${TENANT_DB_APP_PASSWORD:-dev-only-change-me}@postgres:5432/tenant_service?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/people
      OIDC_JWKS_URL: http://keycloak:8080/realms/people/protocol/openid-connect/certs
      OIDC_AUDIENCE: people-api
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_ASSETS_BUCKET: ${S3_ASSETS_BUCKET:-people-platform-tenant-assets}
      S3_PRESIGN_ENDPOINT: http://localhost:${LOCALSTACK_PORT:-4566}
      ASSETS_PUBLIC_BASE_URL: http://localhost:${LOCALSTACK_PORT:-4566}/${S3_ASSETS_BUCKET:-people-platform-tenant-assets}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: tenant-service
    ports:
      - "${TENANT_SERVICE_PORT:-8081}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/tenant-service", "healthcheck"]
    networks: [people-platform-net]

  # ------------------------------------------------- recruitment-service
  recruitment-service-migrate:
    build:
      context: ./services/recruitment-service
    image: people-platform/recruitment-service:dev
    profiles: [recruitment-service]
    command: ["php", "artisan", "migrate", "--database=migrate", "--force"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &recruitment-env
      APP_KEY: ${RECRUITMENT_APP_KEY:-base64:yXBDhbE0qFhUakEUjRuJ0a7s28s3EKZZaIEmdsOQgPY=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: recruitment_service
      DB_USERNAME: recruitment_service_app
      DB_PASSWORD: ${RECRUITMENT_DB_APP_PASSWORD:-dev-only-change-me}
      DB_MIGRATION_USERNAME: recruitment_service_owner
      DB_MIGRATION_PASSWORD: ${RECRUITMENT_DB_OWNER_PASSWORD:-dev-only-change-me}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/people
      OIDC_JWKS_URL: http://keycloak:8080/realms/people/protocol/openid-connect/certs
      OIDC_AUDIENCE: people-api
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_RESUMES_BUCKET: ${S3_RESUMES_BUCKET:-people-platform-recruitment-resumes}
      S3_PRESIGN_ENDPOINT: http://localhost:${LOCALSTACK_PORT:-4566}
      KAFKA_BROKERS: kafka:9092
      CACHE_STORE: file
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
    restart: "no"
    networks: [people-platform-net]

  recruitment-service:
    image: people-platform/recruitment-service:dev
    profiles: [recruitment-service]
    depends_on:
      recruitment-service-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment: *recruitment-env
    ports:
      - "${RECRUITMENT_SERVICE_PORT:-8082}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
    networks: [people-platform-net]

  # Publica a outbox no Kafka (CandidatoContratado em people.recruitment.events.v1).
  recruitment-service-relay:
    image: people-platform/recruitment-service:dev
    profiles: [recruitment-service]
    command: ["php", "artisan", "outbox:relay"]
    depends_on:
      recruitment-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment: *recruitment-env
    restart: unless-stopped

  # Consome TenantCriado (people.tenant.events.v1) e prepara pipeline e configurações do tenant.
  recruitment-service-tenant-consumer:
    image: people-platform/recruitment-service:dev
    profiles: [recruitment-service]
    command: ["php", "artisan", "tenant-events:consume"]
    depends_on:
      recruitment-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment: *recruitment-env
    restart: unless-stopped

  # ---------------------------------------------------- analytics-ai-service
  analytics-ai-service:
    build:
      context: ./services/analytics-ai-service
    image: people-platform/analytics-ai-service:dev
    profiles: [analytics-ai-service]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      HTTP_PORT: "8000"
      KAFKA_BROKERS: kafka:9092
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/people
      OIDC_JWKS_URL: http://keycloak:8080/realms/people/protocol/openid-connect/certs
      OIDC_AUDIENCE: people-api
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dev-only-change-me}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "${ANALYTICS_AI_SERVICE_PORT:-8084}:8000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
    networks: [people-platform-net]

  # ------------------------------------------------- performance-service (perfil performance-service)
  # As migrações Flyway rodam na subida, com o dono do esquema; a aplicação usa o papel sem BYPASSRLS.
  performance-service:
    build:
      context: ./services/performance-service
    image: people-platform/performance-service:dev
    profiles: [performance-service]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/performance_service
      DATABASE_USER: performance_service_app
      DATABASE_PASSWORD: ${PERFORMANCE_DB_APP_PASSWORD:-dev-only-change-me}
      DATABASE_MIGRATION_URL: jdbc:postgresql://postgres:5432/performance_service
      DATABASE_MIGRATION_USER: performance_service_owner
      DATABASE_MIGRATION_PASSWORD: ${PERFORMANCE_DB_OWNER_PASSWORD:-dev-only-change-me}
      KAFKA_BROKERS: kafka:9092
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/people
      OIDC_JWKS_URL: http://keycloak:8080/realms/people/protocol/openid-connect/certs
      OIDC_AUDIENCE: people-api
    ports:
      - "${PERFORMANCE_SERVICE_PORT:-8085}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
    networks: [people-platform-net]

  # ------------------------------------------------- learning-service (perfil learning-service)
  learning-service-migrate:
    build:
      context: ./services/learning-service
    image: people-platform/learning-service:dev
    profiles: [learning-service]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: postgres://learning_service_owner:${LEARNING_DB_OWNER_PASSWORD:-dev-only-change-me}@postgres:5432/learning_service?sslmode=disable
    restart: "no"
    networks: [people-platform-net]

  learning-service:
    image: people-platform/learning-service:dev
    profiles: [learning-service]
    command: ["serve"]
    depends_on:
      learning-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://learning_service_app:${LEARNING_DB_APP_PASSWORD:-dev-only-change-me}@postgres:5432/learning_service?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/people
      OIDC_JWKS_URL: http://keycloak:8080/realms/people/protocol/openid-connect/certs
      OIDC_AUDIENCE: people-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: learning-service
    ports:
      - "${LEARNING_SERVICE_PORT:-8086}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/learning-service", "healthcheck"]
    networks: [people-platform-net]

  # ---------------------------------------------------------------- web (perfil web)
  # A porta 5173 é a que o client people-web do Keycloak autoriza como redirect. O login OIDC acontece no
  # navegador, contra o Keycloak publicado no host; as chamadas de API passam por /api, no gateway.
  web:
    build:
      context: ./web
      args:
        VITE_OIDC_AUTHORITY: http://localhost:${KEYCLOAK_PORT:-8180}/realms/people
    image: people-platform/web:dev
    profiles: [web]
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
    networks: [people-platform-net]

  # -------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      jaeger:
        condition: service_healthy
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    # Imagem distroless (sem shell nem wget): não há como rodar um healthcheck dentro dela.
    # A extensão health_check fica em :13133 para orquestradores externos.
    networks: [people-platform-net]

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:16686/"]
    networks: [people-platform-net]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
    networks: [people-platform-net]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
    networks: [people-platform-net]

  # ---------------------------------------------------------------- tools
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: people-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
    networks: [people-platform-net]

  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8091}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080') === false ? 1 : 0);"]
    networks: [people-platform-net]

  # ------------------------------------------------- engagement-service (perfil engagement-service)
  engagement-service-migrate:
    build:
      context: ./services/engagement-service
    image: people-platform/engagement-service:dev
    profiles: [engagement-service]
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: postgres://engagement_service_owner:${ENGAGEMENT_DB_OWNER_PASSWORD:-dev-only-change-me}@postgres:5432/engagement_service
    restart: "no"
    networks: [people-platform-net]

  engagement-service:
    image: people-platform/engagement-service:dev
    profiles: [engagement-service]
    depends_on:
      engagement-service-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://engagement_service_app:${ENGAGEMENT_DB_APP_PASSWORD:-dev-only-change-me}@postgres:5432/engagement_service
      KAFKA_BROKERS: kafka:9092
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/people
      OIDC_JWKS_URL: http://keycloak:8080/realms/people/protocol/openid-connect/certs
      OIDC_AUDIENCE: people-api
    ports:
      - "${ENGAGEMENT_SERVICE_PORT:-8083}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    networks: [people-platform-net]

volumes:
  postgres-data:
  kafka-data:
  localstack-data:
  mailpit-data:
  prometheus-data:
  grafana-data:

networks:
  people-platform-net:
    name: people-platform-net
