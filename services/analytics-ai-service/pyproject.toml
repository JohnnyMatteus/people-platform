[project]
name = "analytics-ai-service"
version = "0.1.0"
description = "People analytics agregado e recursos de IA com saída validada por schema."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "openai==3.57.0",
  "pyjwt[crypto]==2.15.1",
  "aiokafka==0.15.0",
  "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "ruff==0.17.6",
  "mypy==2.4.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"analytics_ai.adapters.migrations" = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
